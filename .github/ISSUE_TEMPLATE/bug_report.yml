name: Bug report
description: Report a reproducible gmOS bug without sharing private memory content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please keep reports content-free: do not paste real user memory, private transcripts, API keys, or production SQLite files.
  - type: input
    id: version
    attributes:
      label: gmOS version
      description: Package version or git SHA.
      placeholder: "@ghast/memory@0.1.0-alpha.x"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gmos doctor output
      description: Run `gmos doctor --db <synthetic-or-local-db> --format markdown`. Redact paths if needed; do not include memory content.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic data or a minimal fixture.
      placeholder: |
        1. Create a fresh database.
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - SDK
        - CLI
        - MCP
        - HTTP
        - Store / SQLite
        - Benchmarks
        - Docs
    validations:
      required: true
