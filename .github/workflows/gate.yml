name: Public Gate

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.node-version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - "20"
          - "22"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: gmos-node-modules-${{ matrix.os }}-${{ matrix.node-version }}-${{ hashFiles('package.json') }}

      - name: Install
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: PR gate
        run: npm run gate:pr
