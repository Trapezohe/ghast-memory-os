[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmos-client"
version = "0.1.0-alpha.71"
description = "Stdlib-only Python client for the gmOS Memory HTTP API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["gmos_client*"]
